[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronevio"
version = "0.1.0"
description = "Monocular visual(-inertial) odometry for indoor drones, built from first principles"
authors = [{ name = "Yanis Halloum" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python>=4.8",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "evo>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
learned = ["torch>=2.1", "kornia>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
